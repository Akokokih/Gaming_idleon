<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idleon · Gaming</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#111714;color:#e7efe8}
*{box-sizing:border-box}body{max-width:650px;margin:8vh auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:29px;font-weight:600;letter-spacing:-1px;margin:0}p{color:#a4b5a8;line-height:1.6}small{font-size:12px;color:#a4b5a8}section{background:#1a241e;border:1px solid #304137;border-radius:18px;padding:24px;margin:28px 0 18px}#status{min-height:52px;line-height:1.5;margin:0 0 22px}nav{display:flex;gap:12px}button{font:inherit;font-weight:600;padding:13px 25px;border-radius:10px;border:1px solid #3b5143;background:#26382c;color:#e7efe8;cursor:pointer}#start{background:#b5e1a4;color:#18251b;border:0}button:disabled{opacity:.4;cursor:default}kbd{background:#26382c;padding:3px 7px;border-radius:5px}pre{font:12px/1.8 ui-monospace,Consolas,monospace;white-space:pre-wrap;color:#a4b5a8;max-height:270px;overflow:auto}summary{cursor:pointer;color:#a4b5a8}#badge{font-size:12px;border:1px solid #3b5143;padding:6px 10px;border-radius:99px;color:#b5e1a4}footer{display:flex;justify-content:space-between;margin-top:22px}footer button{font-size:12px;padding:6px 12px;background:transparent}
</style>
<header><h1>Idleon <span style="color:#b5e1a4">/ Gaming</span></h1><span id="badge">Idle</span></header>
<p>Harvest. Play the log. Advance time.</p>
<section><div id="status" role="status" aria-live="polite">Connecting…</div><nav><button id="start">Start</button><button id="stop" disabled>Stop</button></nav></section>
<p style="font-size:14px">Open the <b>Gaming</b> panel in the game before starting.<br>Keep the game visible and in the foreground. Press <kbd>F8</kbd> to stop the bot at any time.</p>
<details open><summary>Activity log</summary><pre id="log">No actions yet.</pre></details>
<footer><small>Local only · harvest delay 2 s · cards 1 s</small><button id="quit">Quit application</button></footer>
<script>
const $=id=>document.getElementById(id);let closed=false;
async function act(action){try{const r=await fetch('/api/'+action,{method:'POST',headers:{'X-App-Token':'__TOKEN__'}});if(!r.ok)throw Error('Action rejected');if(action==='quit'){closed=true;$('status').textContent='Application closed. You can close this tab.';$('start').disabled=true;$('stop').disabled=true;$('badge').textContent='Closed';}else await update();}catch(e){$('status').textContent=e.message;}}
async function update(){if(closed)return;try{const r=await fetch('/api/state');const s=await r.json();$('status').textContent=s.status;$('start').disabled=s.running;$('stop').disabled=!s.running;$('badge').textContent=s.running?'Running':'Idle';const l=$('log');const text=s.log.join('\n')||'No actions yet.';if(l.textContent!==text){l.textContent=text;l.scrollTop=l.scrollHeight;}}catch(e){$('status').textContent='Application disconnected. Launch run.cmd again.';$('start').disabled=true;$('stop').disabled=true;}}
$('start').onclick=()=>act('start');$('stop').onclick=()=>act('stop');$('quit').onclick=()=>act('quit');update();setInterval(update,700);
</script></html>
